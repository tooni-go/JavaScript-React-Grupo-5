name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────────────────────────
      # 1. CHECKOUT Y ENTORNO
      # ─────────────────────────────────────────────────────────────
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Instalar dependencias del monorepo
        run: pnpm install --frozen-lockfile

      # ─────────────────────────────────────────────────────────────
      # 2. FRONTEND (Next.js con output: "export")
      # ─────────────────────────────────────────────────────────────
      - name: Compilar Frontend
        working-directory: frontend
        run: pnpm run build:deploy

      - name: Subir Frontend a ~/public_html/
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22002
          source: "frontend/out/**"
          target: "~/public_html/"
          strip_components: 2

      # ─────────────────────────────────────────────────────────────
      # 3. BACKEND (NestJS + Prisma)
      # ─────────────────────────────────────────────────────────────
      - name: Generar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Compilar Backend
        working-directory: backend
        run: pnpm run build:deploy

      - name: Subir dist/ a ~/servicios/dist/
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22002
          source: "backend/dist/**"
          target: "~/servicios/dist/"
          strip_components: 2

      - name: Subir prisma/ a ~/servicios/prisma/
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22002
          source: "backend/prisma/**"
          target: "~/servicios/prisma/"
          strip_components: 2

      - name: Subir prisma.config.ts y package.json a ~/servicios/
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22002
          source: "backend/prisma.config.ts,backend/package.json"
          target: "~/servicios/"
          strip_components: 1

      # ─────────────────────────────────────────────────────────────
      # 4. MIGRACIÓN + SEED + REINICIO PM2
      # ─────────────────────────────────────────────────────────────
      - name: Migrar BD, seed y reiniciar PM2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22002
          script_stop: |
            # Script que se ejecuta si hay error - intenta recovery de migraciones fallidas
            echo "⚠️ La migración falló. Intentando recovery..."
            cd ~/servicios
            FAILED_MIGRATION=$(npx prisma migrate status 2>&1 | grep -oE '[0-9]{14}_\w+' | head -1)
            if [ ! -z "$FAILED_MIGRATION" ]; then
              echo "Marcando migración $FAILED_MIGRATION como resuelta..."
              npx prisma migrate resolve --rolled-back "$FAILED_MIGRATION" || npx prisma migrate resolve --applied "$FAILED_MIGRATION" || true
            fi
            # Si hay una base de datos corrupta, recrearla
            if npx prisma migrate deploy 2>&1 | grep -q "P3009"; then
              echo "⚠️ Base de datos corrupta detectada. Recreando..."
              rm -f dev.db
              echo "y" | npx prisma migrate reset --force
            else
              npx prisma migrate deploy || { echo "❌ La migración sigue fallando"; exit 1; }
            fi
            npx prisma generate
            npx prisma db seed || echo "⚠️ Seed no aplicado (puede que ya existan datos)"
            pm2 restart servicios
          script: |
            cd ~/servicios
            set -e  # Falla inmediatamente si hay error
            echo "🔄 Aplicando migraciones..."
            npx prisma migrate deploy
            echo "✅ Migraciones aplicadas"
            echo "🌱 Ejecutando seed..."
            npx prisma db seed || echo "⚠️ Seed no aplicado (puede que ya existan datos)"
            echo "🔄 Generando Prisma Client..."
            npx prisma generate
            echo "🔄 Reiniciando servicio..."
            pm2 restart servicios
            echo "✅ Deploy completado"
