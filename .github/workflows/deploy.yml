# .github/workflows/deploy-frontend.yml
name: Desplegar Frontend

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Si tu carpeta se llama distinto de 'frontend', cambialo acá abajo
      - name: Instalar dependencias
        run: |
          cd frontend        
          npm ci            

      - name: Compilar la app
        run: |
          cd frontend        
          npm run build     # Esto en Next.js genera la carpeta 'out'

      - name: Subir artefacto de la compilación
        uses: actions/upload-artifact@v4
        with:
          name: app-compilada   
          path: frontend/out # <-- CORREGIDO: 'out' en vez de 'dist' para Next.js

      - name: Descargar artefacto compilado
        uses: actions/download-artifact@v4
        with:
          name: app-compilada
          path: build-temp 

      - name: Copiar archivos al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }} # <-- CORREGIDO: password en vez de key
          port: 22002                              # <-- CORREGIDO: Puerto SSH de tu poli
          source: "build-temp/" 
          target: "~/public_html/"                 # <-- CORREGIDO: Ruta para el usuario de tu Poli